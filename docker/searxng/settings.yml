# SearXNG settings for the cluster's research feature (LAN only).
# The secret key comes from SEARXNG_SECRET in /mnt/blackboard/config/searxng.env (not in Git).
use_default_settings: true
general:
  instance_name: "blackboard search"
server:
  limiter: false        # no rate limiter: only the cluster uses this instance
  image_proxy: false
  method: "GET"
search:
  safe_search: 0
  formats:
    - html
    - json              # the research module reads results as JSON
