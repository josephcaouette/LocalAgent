services:
  redis:
    image: redis:7-alpine
    container_name: blackboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - /mnt/blackboard/redis-data:/data
    command: redis-server --appendonly yes

  qdrant:
    image: qdrant/qdrant:latest
    container_name: blackboard-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - /mnt/blackboard/qdrant-data:/qdrant/storage

  # Telemetry dashboard on port 8080 (restarts with Docker after a reboot).
  # Building it also produces agent-sandbox:latest, the image the pipeline uses for
  # its throwaway per-run test containers (docker run --rm, no network by default).
  # The old always-on "agent-sandbox" container, which had the workspace mounted
  # read-write, was removed.
  dashboard:
    build: ./sandbox
    image: agent-sandbox:latest
    container_name: blackboard-dashboard
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    command: python3 -u agent_dashboard.py
    environment:
      - AGENT_REDIS_HOST=redis
    ports:
      - "8080:8080"
    volumes:
      - /mnt/blackboard/workspace:/app:ro
      - /mnt/blackboard/config:/config:ro
    depends_on:
      - redis

  # Private metasearch engine for the research feature (LAN only, JSON API on port 8888).
  # Settings: docker/searxng/settings.yml. Secret key: /mnt/blackboard/config/searxng.env.
  searxng:
    image: searxng/searxng:latest
    container_name: blackboard-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://192.168.254.25:8888/
    env_file:
      - /mnt/blackboard/config/searxng.env
    volumes:
      - /mnt/blackboard/docker/searxng:/etc/searxng

  # Embedding model for long-term memory (on Node 3 until 2026-11-07), CPU only: Node 2 has no GPU.
  # Ollama and qwen3-embedding:0.6b were copied from Node 3 (same version, without its GPU
  # libraries) into /home/server/ollama_cpu, outside the share, so the backup never commits them.
  # The model files are read-only, so nobody on the network can pull other models into it (the
  # folder itself stays writable: this version keeps a manifests-v2 index next to them).
  embed:
    image: agent-sandbox:latest
    container_name: blackboard-embed
    restart: unless-stopped
    user: "1000:1000"
    command: ["/ollama/bin/ollama", "serve"]
    environment:
      - HOME=/ollama/home
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/ollama/models
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NOPRUNE=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NO_CLOUD=1
      - LLAMA_ARG_CACHE_RAM=0      # llama.cpp's prompt cache (8 GB by default) is no use for embeddings
    ports:
      - "11434:11434"
    volumes:
      - /home/server/ollama_cpu/bin:/ollama/bin:ro
      - /home/server/ollama_cpu/lib:/ollama/lib:ro
      - /home/server/ollama_cpu/models:/ollama/models
      - /home/server/ollama_cpu/models/blobs:/ollama/models/blobs:ro
      - /home/server/ollama_cpu/models/manifests:/ollama/models/manifests:ro
      - /home/server/ollama_cpu/home:/ollama/home
    mem_limit: 4g
